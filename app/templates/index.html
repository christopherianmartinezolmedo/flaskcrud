{% extends "layout.html" %}
{% block body %}

  <div class="row">
    <div class="col-md-5">
      <div class="card card-body">
        <form action="{{url_for('contacts.add_contact')}}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <input type="text" class="form-control" name="fullname" placeholder="FullName">
          </div>
          <div class="form-group">
            <input type="email" class="form-control" name="email" required placeholder="Email">
          </div>
          <div class="form-group">
            <input type="text" class="form-control" name="phone" placeholder="Phone">
          </div>
          <button class="btn btn-primary btn-block">
            Save 
          </button>
        </form>
      </div>
    </div>
    <div class="col-md-7">
      <table class="table table-striped table-hover table-bordered table-sm bg-white">
        <thead>
          <tr>
            <td>ID</td>
            <td>fullname</td>
            <td>email</td>
            <td>phone</td>
            <td>Operations</td>
          </tr>
        </thead>
        <tbody>
          {% for contact in contacts %}
          <tr>
            <td>{{contact.id}}</td>
            <td>{{contact.fullname}}</td>
            <td>{{contact.email}}</td>
            <td>{{contact.phone}}</td>
            <td>
              <a href="{{ url_for('contacts.get_contact', id=contact.id) }}" class="btn btn-secondary">edit</a>
              <form action="{{ url_for('contacts.delete_contact', id=contact.id) }}" method="POST" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-danger btn-delete">delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

{% endblock %}
